# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]

# changelog header
header = """
# What's new\n
"""
# Template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% for group, commits in commits | group_by(attribute="group") %}
    ## {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} ({{ commit.id }})\
    {% endfor %}
{% endfor %}\n
"""

# Remvoes the leading and trailing whitespace from the templates
trim = true

[git]

# Parses the commits based on https://www.conventionalcommits.org
conventional_commits = true

# Filters out the commits that are not conventional
filter_unconventional = true

# Processes each line of a commit as an individual commit
split_commits = false

# Regex for parsing and grouping commits
# We assume commits of build (build:) and style (style:) should not appear in generate release note
commit_parsers = [
  { message = "^(feat|fix|docs|chore|refactor|test|ci)(\\([^)]*\\))?!:", group = "<!-- 0 -->💥 Breaking changes" },
  { message = "^feat(\\([^)]*\\))?:", group = "<!-- 1 -->🚀 Features" },
  { message = "^fix(\\([^)]*\\))?:", group = "<!-- 2 -->🐛 Fixes" },
  { message = "^docs(\\([^)]*\\))?:", group = "<!-- 4 -->📖 Docs" },
  { message = "^(chore|refactor|test|ci)(\\([^)]*\\))?:", group = "<!-- 3 -->🧰 Chore" },
]
commit_preprocessors = [
    { pattern = '.*', replace_command = 'git show -s --format=%B $COMMIT_SHA' }
]

# Protects breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = false

# Filters out the commits that are not matched by commit parsers
filter_commits = true

# Regex for matching git tags
tag_pattern = "[0-9].*"

# Regex for skipping tags
skip_tags = "v0.1.0-beta.1"

# Regex for ignoring tags
ignore_tags = ".*-(rc|beta|alpha)\\..*"

# Sorts the tags topologically
topo_order = false

# Sorts the commits inside sections by oldest/newest order
sort_commits = "newest"